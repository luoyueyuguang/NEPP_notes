name: Build LaTeX

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install TeX Live and fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            texlive-xetex \
            texlive-latex-recommended \
            texlive-latex-extra \
            texlive-lang-chinese \
            texlive-fonts-recommended \
            texlive-fonts-extra \
            fonts-noto \
            fonts-noto-cjk \
            latexmk

      # 静态回归哨兵：校验 408 + math 全部解析块的配对 / 孤儿环境 / 书写留白。
      # 纯 Python，无需 LaTeX，是纯题目版正确性的快速门禁。
      - name: Static check solution blocks
        run: |
          python3 scripts/check_solutions.py

      # 双版本构建：为 408 与 math 各产出 *-full.pdf（题目+解析）与
      # *-exercises.pdf（纯题目，解析隐藏、每题后是 \answerarea 书写留白）。
      # 纯题目版用 main.tex 临时副本（\showsolutionsfalse）编译，绝不改动源文件；
      # 构建后校验硬错误（^!）、缺字符、重复标签与页数 sanity。
      - name: Build both books (full + exercises)
        run: |
          bash scripts/build.sh

      - name: Upload PDFs artifact
        uses: actions/upload-artifact@v4
        with:
          name: pdfs
          path: |
            408/408-full.pdf
            408/408-exercises.pdf
            math/math-full.pdf
            math/math-exercises.pdf
          retention-days: 7
